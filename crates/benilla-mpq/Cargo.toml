[package]
name = "benilla-mpq"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only MPQ archive reader for WoW 1.12.1 (build 5875)"

[lints]
workspace = true

[dependencies]
# Bounds-checked byte readers and the allocation cap on the header, block table and sectors.
benilla-bytes = { path = "../benilla-bytes" }
# Inflate for the ZLIB (0x02) sector codec, on its pure-Rust miniz_oxide backend.
flate2 = "1.1"

[features]
browser-files = ["dep:wasm-bindgen", "dep:js-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.122", optional = true }
js-sys = { version = "0.3", optional = true }
